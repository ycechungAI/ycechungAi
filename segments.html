<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overgeared segments (1–3)</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    button { cursor: pointer; padding: 8px 12px; border: 1px solid #8885; border-radius: 8px; background: #8881; font: inherit; }
    button[aria-pressed="true"] { background: #0969da; color: #fff; border-color: #0969da; }
    .panel { display: none; margin-top: 12px; }
    .panel.active { display: block; }
    .panel img { max-width: 100%; height: auto; border-radius: 8px; display: block; }
    .meta { margin: 8px 0 0; font-size: 0.95rem; }
    a { color: #0969da; }
  </style>
</head>
<body>
  <h1>Overgeared recap — segments (10× sped-up GIFs)</h1>
  <p class="meta">Click a segment (or use ← / →). Only the selected GIF is shown. GIFs link to YouTube at the matching time.</p>
  <div class="controls" role="tablist" aria-label="Segments">
    <button type="button" class="tab" data-seg="1" aria-pressed="true">Segment 1</button>
    <button type="button" class="tab" data-seg="2" aria-pressed="false">Segment 2</button>
    <button type="button" class="tab" data-seg="3" aria-pressed="false">Segment 3</button>
    <button type="button" id="prev" aria-label="Previous segment">←</button>
    <button type="button" id="next" aria-label="Next segment">→</button>
  </div>

  <section id="seg-1" class="panel active" aria-label="Segment 1">
    <p class="meta"><strong>Segment 1/3</strong> (0:00–10:00, 10×)</p>
    <a href="https://www.youtube.com/watch?v=mqb6pXmRKhs&t=0s"><img src="assets/overgeared-chunk01.gif" alt="Overgeared segment 1"></a>
  </section>
  <section id="seg-2" class="panel" aria-label="Segment 2">
    <p class="meta"><strong>Segment 2/3</strong> (10:00–20:00, 10×)</p>
    <a href="https://www.youtube.com/watch?v=mqb6pXmRKhs&t=600s"><img src="assets/overgeared-chunk02.gif" alt="Overgeared segment 2"></a>
  </section>
  <section id="seg-3" class="panel" aria-label="Segment 3">
    <p class="meta"><strong>Segment 3/3</strong> (20:00–30:00, 10×)</p>
    <a href="https://www.youtube.com/watch?v=mqb6pXmRKhs&t=1200s"><img src="assets/overgeared-chunk03.gif" alt="Overgeared segment 3"></a>
  </section>

  <script>
    const tabs = [...document.querySelectorAll('.tab')];
    const panels = [...document.querySelectorAll('.panel')];
    let current = 1;
    function show(n) {
      current = Math.max(1, Math.min(3, n));
      tabs.forEach(t => t.setAttribute('aria-pressed', String(Number(t.dataset.seg) === current)));
      panels.forEach(p => p.classList.toggle('active', p.id === 'seg-' + current));
    }
    tabs.forEach(t => t.addEventListener('click', () => show(Number(t.dataset.seg))));
    document.getElementById('prev').addEventListener('click', () => show(current - 1));
    document.getElementById('next').addEventListener('click', () => show(current + 1));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
    });
  </script>
</body>
</html>
